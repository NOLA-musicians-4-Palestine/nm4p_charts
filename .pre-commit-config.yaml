repos:
  - repo: local
    hooks:
      - id: ly-reformat
        name: ly reformat
        language: python
        additional_dependencies: [python-ly]
        entry: ly -i reformat
        files: \.i?ly$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        files: \.i?ly$
